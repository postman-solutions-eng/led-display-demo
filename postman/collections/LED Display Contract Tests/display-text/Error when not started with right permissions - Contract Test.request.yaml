$kind: http-request
url: "{{baseUrl}}/display-text"
method: POST
headers:
  Content-Type: application/json
  x-mock-response-code: "500"
body:
  type: json
  content: |-
    {
      "text": "Hello World!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 500", function () {
          pm.response.to.have.status(500);
      });

      pm.test("Response indicates server error", function () {
          const body = pm.response.json();
          pm.expect(body.error).to.equal("Internal Server Error");
          pm.expect(body.details).to.include("right permissions to access the LED");
      });
    language: text/javascript
order: 3000
