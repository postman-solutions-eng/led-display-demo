$kind: http-example
name: Error when not started with right permissions
request:
  url: "{{baseUrl}}/display-text"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "text": "Are you up correctly?"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
    Server: Werkzeug/3.1.4 Python/3.13.5
    Date: Mon, 19 Jan 2026 12:16:58 GMT
    Content-Length: "265"
    Connection: close
  body:
    type: json
    content: |-
      {
        "error": "Internal Server Error",
        "details": "Probably the server has not been started with the right permissions to access the LED"
      }
order: 52000
