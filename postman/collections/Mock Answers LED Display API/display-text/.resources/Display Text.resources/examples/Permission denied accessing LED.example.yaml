$kind: http-example
name: Permission denied accessing LED
request:
  url: "{{baseUrl}}/display-text"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: X-API-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "text": "Hello World!"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
    Server: Werkzeug/3.1.4 Python/3.13.5
    Date: Mon, 19 Jan 2026 12:16:58 GMT
    Content-Length: "265"
    Connection: close
  body:
    type: json
    content: |-
      {
        "error": "Permission denied",
        "details": "The server does not have permission to access the LED device. Start the server with sufficient privileges or configure udev rules."
      }
order: 4100
