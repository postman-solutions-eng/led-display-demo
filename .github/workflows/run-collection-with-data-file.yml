name: Run LED Display API Collection with Data File

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-collection-with-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Run Collection with Data File and Environment
        run: |
          postman collection run "postman/collections/LED Display API - Data File Test Suite" \
            --iteration-data "data-file.csv" \
            --environment "postman/environments/LED Display Mock Environment.environment.yaml" \
            --working-dir "$GITHUB_WORKSPACE" \
            --report-events
