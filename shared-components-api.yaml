openapi: 3.0.0
info:
  title: Shared Components API
  version: 1.0.0
  description: >-
    # API for controlling LED name badge displays


    This API allows you to update the text and visual content displayed on LED
    badges, including support for alphanumeric text and predefined icon codes.

    <img
    src="https://content.pstmn.io/05b1ef2c-9fd3-4f0e-8b2f-76998fb3f6e5/aW1hZ2UucG5n"
    width="240">

    ## Supported Icons


    The following icon codes can be embedded in text using the `:icon_name:`
    syntax:


    - `:ball:` - Filled circle
        
    - `:happy:` - Simple smiley face
        
    - `:happy2:` - Larger smiley (2 columns wide)
        
    - `:heart:` - Outline heart
        
    - `:HEART:` - Filled heart
        
    - `:heart2:` - Larger outline heart (2 columns wide)
        
    - `:HEART2:` - Larger filled heart (2 columns wide)
        
    - `:fablab:` - FabLab logo
        
    - `:bicycle:` - Bicycle icon (3 columns wide)
        
    - `:bicycle_r:` - Bicycle facing right (3 columns wide)
        
    - `:owncloud:` - OwnCloud logo (3 columns wide)
        
    - `:octocat:` - GitHub Octocat
        
    - `:smile:` - Smile emoji
        
    - `:star:` - Star icon
        
    - `:sun:` - Sun icon
        

    ## Character Restrictions


    **Supported characters:**


    - Letters: A-Z, a-z
        
    - Numbers: 0-9
        
    - Special characters: `^ !"$%&/()=?` °}\]\[{@ \~ |<>,;.:-_#'+_\`
        
    - German umlauts: äöüÄÖÜß
        
    - French/European accents: àäòöùüèéêëôöûîïÿçÀÅÄÉÈÊËÖÔÜÛÙŸŠ
        

    **NOT supported:**


    - Unicode emoji (e.g., 🌍) - will return a 400 error
        

    **Escape sequences:**


    - `::` - Escapes to a single literal colon
        

    **Custom images:**


    - Use `:path/to/image.png:` syntax to reference custom images
        
    - Images must be exactly 11 pixels high
        

    ## Additional Capabilities (not exposed in API yet)


    - **Brightness control:** 25%, 50%, 75%, 100%
        
    - **Animation modes:** 0-8 (various scroll and display effects)
        
    - **Speed control:** 1-8 (animation speed)
        
    - **Blink effect:** Enable/disable blinking
        
    - **Ant effect:** Marching border animation
        

    ## How the spec was created


    This spec was created by having analyzed the backend Python code with
    Postman Agent mode with the following prompt:


    > The spec and the Postman collection both seem very incomplete, not
    containing all possible icons and other character restrictions. Can you scan
    the backend API code to find out what additional endpoints and capabilities
    regarding icons and character restrictions there are and update the spec
    accordingly?
servers:
  - url: http://127.0.0.1:5001

security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        API key for requests to the LED Display API. On `/display-summary`, when
        set, also used to fetch services from the Postman API Catalog; when
        omitted or empty, the default demo summary is shown.
  responses:
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: https://components.pstmn.io/automotive-demo/RFC-9457-Error/RFC-9457-Error-2.0#/components/schemas/ProblemDetails 
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
paths:
  /display-text:
    post:
      summary: Display Text
      responses:
        '200':
          description: Success with Text + Heart Icon
          headers:
            Server:
              schema:
                type: string
              example: Werkzeug/3.1.5 Python/3.13.7
            Date:
              schema:
                type: string
              example: Mon, 19 Jan 2026 12:16:21 GMT
            Content-Length:
              schema:
                type: integer
              example: '65'
            Connection:
              schema:
                type: string
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  text:
                    type: string
              example:
                status: Text displayed on LED
                text: 'Hello World! :heart:'
        '400':
          description: Failure HTML Response (Unicode)?
          headers:
            Server:
              schema:
                type: string
              example: Werkzeug/3.1.4 Python/3.13.5
            Date:
              schema:
                type: string
              example: Mon, 19 Jan 2026 12:47:31 GMT
            Content-Length:
              schema:
                type: integer
              example: '69'
            Connection:
              schema:
                type: string
              example: close
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                details: '''🌍'''
                error: Invalid display string format
        '403':
          description: Permission denied accessing the LED device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Permission denied
                details: >-
                  The server does not have permission to access the LED device.
                  Start the server with sufficient privileges or configure udev
                  rules.
        '500':
          description: Error when not started with right permissions
          headers:
            Server:
              schema:
                type: string
              example: Werkzeug/3.1.4 Python/3.13.5
            Date:
              schema:
                type: string
              example: Mon, 19 Jan 2026 12:16:58 GMT
            Content-Length:
              schema:
                type: integer
              example: '265'
            Connection:
              schema:
                type: string
              example: close
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Internal Server Error
                details: >-
                  Probably the server has not been started with the right
                  permissions to access the LED
      tags:
        - display-text
      description: >-
        Updates the text and visual content displayed on the LED name badge.
        Accepts text and icon codes in the format `:icon_name:`.


        <img
        src="https://content.pstmn.io/05b1ef2c-9fd3-4f0e-8b2f-76998fb3f6e5/aW1hZ2UucG5n"
        width="240">


        ## Supported Icons


        The following icon codes can be embedded in text using the `:icon_name:`
        syntax:


        - `:ball:` - Filled circle
            
        - `:happy:` - Simple smiley face
            
        - `:happy2:` - Larger smiley (2 columns wide)
            
        - `:heart:` - Outline heart
            
        - `:HEART:` - Filled heart
            
        - `:heart2:` - Larger outline heart (2 columns wide)
            
        - `:HEART2:` - Larger filled heart (2 columns wide)
            
        - `:fablab:` - FabLab logo
            
        - `:bicycle:` - Bicycle icon (3 columns wide)
            
        - `:bicycle_r:` - Bicycle facing right (3 columns wide)
            
        - `:owncloud:` - OwnCloud logo (3 columns wide)
            
        - `:octocat:` - GitHub Octocat
            
        - `:smile:` - Smile emoji
            
        - `:star:` - Star icon
            
        - `:sun:` - Sun icon
            

        ## Character Restrictions


        **Supported characters:**


        - Letters: A-Z, a-z
            
        - Numbers: 0-9
            
        - Special characters: `^ !"$%&/()=?` °}\]\[{@ \~ |<>,;.:-_#'+_\`
            
        - German umlauts: äöüÄÖÜß
            
        - French/European accents: àäòöùüèéêëôöûîïÿçÀÅÄÉÈÊËÖÔÜÛÙŸŠ
            

        **NOT supported:**


        - Unicode emoji (e.g., 🌍) - will return a 400 error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: >-
                    The text to display, optionally including icon codes in
                    icon_name format
            example:
              text: Hello World!
  /predefined-icons:
    get:
      summary: Get Predefined Icons
      responses:
        '200':
          description: List of all available icon codes
          headers:
            Server:
              schema:
                type: string
              example: Werkzeug/3.1.5 Python/3.13.7
            Date:
              schema:
                type: string
              example: Mon, 19 Jan 2026 12:20:00 GMT
            Connection:
              schema:
                type: string
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  icons:
                    type: array
                    description: Array of icon codes in :icon_name format
                    items:
                      type: string
              example:
                icons:
                  - ':ball:'
                  - ':happy:'
                  - ':happy2:'
                  - ':heart:'
                  - ':HEART:'
                  - ':heart2:'
                  - ':HEART2:'
                  - ':fablab:'
                  - ':bicycle:'
                  - ':bicycle_r:'
                  - ':owncloud:'
                  - ':octocat:'
                  - ':smile:'
                  - ':star:'
                  - ':sun:'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - predefined-icons
      description: >-
        Returns a list of all available icon codes that can be used in display
        text. Icons are returned as simple string codes in the `:icon_name:`
        format.
  /display-summary:
    post:
      summary: Display Summary
      responses:
        '200':
          description: Summary message displayed successfully
          headers:
            Server:
              schema:
                type: string
              example: Werkzeug/3.1.5 Python/3.13.7
            Date:
              schema:
                type: string
              example: Mon, 19 Jan 2026 12:25:00 GMT
            Connection:
              schema:
                type: string
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the operation
                  source:
                    type: string
                    description: >-
                      Present when a Postman API key was supplied. Indicates the
                      summary was built from the Postman API catalog.
                    enum:
                      - postman-api-catalog
                  text:
                    type: string
                    description: The text rendered on the LED badge
                  systemEnvironment:
                    type: object
                    description: >-
                      The API catalog system environment used to list services
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                  serviceCount:
                    type: integer
                    description: Number of services returned for the summary
                  hasMore:
                    type: boolean
                    description: >-
                      True when additional catalog services exist beyond the
                      fetched page
                  services:
                    type: array
                    description: Catalog services included in the summary
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                            - healthy
                            - warning
                            - critical
                            - inactive
              examples:
                defaultSummary:
                  summary: Default summary without Postman API key
                  value:
                    status: Summary displayed on LED
                catalogSummary:
                  summary: Summary built from the Postman API catalog
                  value:
                    status: Summary displayed on LED
                    source: postman-api-catalog
                    text: 'Production - 3 svcs (2 ok, 1 warn) :star:'
                    systemEnvironment:
                      id: e34d6213-509d-4b61-94da-8b8c093cb925
                      name: Production
                    serviceCount: 3
                    hasMore: false
                    services:
                      - id: 11111111-1111-1111-1111-111111111111
                        name: payments-api
                        status: healthy
                      - id: 22222222-2222-2222-2222-222222222222
                        name: billing-api
                        status: warning
                      - id: 33333333-3333-3333-3333-333333333333
                        name: users-api
                        status: healthy
        '400':
          description: Invalid display string format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Postman API key is invalid or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No API catalog system environments found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied accessing the LED device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Permission denied
                details: >-
                  The server does not have permission to access the LED device.
                  Start the server with sufficient privileges or configure udev
                  rules.
        '500':
          description: Error when not started with right permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Internal Server Error
                details: >-
                  Probably the server has not been started with the right
                  permissions to access the LED
        '502':
          description: Postman API catalog request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - display-summary
      description: >-
        Displays a summary message on the LED badge.


        Without an API key (`X-API-Key` header or `apiKey` in the body), shows
        the built-in demo summary text. When a key is provided, the endpoint
        fetches services from the Postman API Catalog and renders a compact
        health summary on the badge.


        Note: The API does not validate the `type` parameter and will return
        success for any type value provided.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: >-
                    The type of summary message to display (e.g., welcome,
                    status, alert, info)
                customText:
                  type: string
                  description: Optional custom text to append to the summary
                apiKey:
                  type: string
                  description: >-
                    Optional alternative to the `X-API-Key` header for supplying
                    a Postman API key (`PMAK-...`) used to fetch the API catalog
                systemEnvironmentId:
                  type: string
                  format: uuid
                  description: >-
                    Optional API catalog system environment ID. When omitted, the
                    first production environment is used, otherwise the first
                    environment with associations, otherwise the first available
                    environment.
            examples:
              defaultSummary:
                summary: Default demo summary
                value:
                  type: welcome
                  customText: John
              catalogSummary:
                summary: API catalog summary
                value:
                  systemEnvironmentId: e34d6213-509d-4b61-94da-8b8c093cb925
