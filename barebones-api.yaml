openapi: 3.0.0
info:
  title: Barebones LED Display API
  version: 1.0.0
  description: >-
    API for controlling LED name badge displays. This API allows you to update
    the text and visual content displayed on LED badges, including support for
    alphanumeric text and predefined icon codes. All capabilities and specific
    characters allowed still need to be figured out.


    <img
    src="https://content.pstmn.io/05b1ef2c-9fd3-4f0e-8b2f-76998fb3f6e5/aW1hZ2UucG5n"
    width="240">
servers:
  - url: http://127.0.0.1:5001
paths:
  /display-texts:
    post:
      summary: Display Text
      responses:
        '200':
          description: Success with Text + Heart Icon
          headers:
            Server:
              schema:
                type: string
              example: Werkzeug/3.1.5 Python/3.13.7
            Date:
              schema:
                type: string
              example: Mon, 19 Jan 2026 12:16:21 GMT
            Content-Length:
              schema:
                type: integer
              example: '65'
            Connection:
              schema:
                type: string
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  text:
                    type: string
                    format: style
              example:
                status: Text displayed on LED
                text: 'Hello World! :heart:'
        '400':
          description: Failure HTML Response (Unicode)?
          headers:
            Server:
              schema:
                type: string
              example: Werkzeug/3.1.4 Python/3.13.5
            Date:
              schema:
                type: string
              example: Mon, 19 Jan 2026 12:47:31 GMT
            Content-Length:
              schema:
                type: integer
              example: '69'
            Connection:
              schema:
                type: string
              example: close
          content:
            application/json:
              schema:
                type: object
                properties:
                  details:
                    type: string
                  error:
                    type: string
              example:
                details: '''🌍'''
                error: Invalid display string format
        '500':
          description: Error when not started with right permissions
          headers:
            Server:
              schema:
                type: string
              example: Werkzeug/3.1.4 Python/3.13.5
            Date:
              schema:
                type: string
              example: Mon, 19 Jan 2026 12:16:58 GMT
            Content-Length:
              schema:
                type: integer
              example: '265'
            Connection:
              schema:
                type: string
              example: close
      description: >-
        Updates the text and visual content displayed on the LED name badge.
        Accepts text and icon codes in the format :icon_name:.


        <img
        src="https://content.pstmn.io/05b1ef2c-9fd3-4f0e-8b2f-76998fb3f6e5/aW1hZ2UucG5n"
        width="240">
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
            example:
              text: Hello World!
